; PHP-Limits fuer das Admin-Panel.
;
; Hintergrund: PHP erlaubt von Haus aus nur upload_max_filesize = 2M. Das Panel
; verspricht aber Bilder bis 5 MB - ohne diese Datei scheitert schon ein 2-MB-Foto.
; Die Werte liegen bewusst ueber 5 MB, weil im selben POST auch die Formularfelder
; stecken (post_max_size muss groesser als upload_max_filesize sein).
;
; Wirkt bei PHP als FastCGI / PHP-FPM / LiteSpeed - dem Standard bei den meisten
; Hostern. Laeuft PHP als Apache-Modul (mod_php), greift stattdessen die .htaccess
; in diesem Verzeichnis. Aenderungen werden erst nach bis zu 5 Minuten wirksam
; (PHP-Einstellung user_ini.cache_ttl).
;
; Nur fuer panel/ - die oeffentlichen Seiten behalten die kleinen Standardlimits.

upload_max_filesize = 8M
post_max_size = 12M
